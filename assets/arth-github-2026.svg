<text x="1365" y="54" text-anchor="end" class="mono" font-size="11" letter-spacing="2.5" fill="#6ee7b7">ONLINE</text>

<g>
  <text x="58" y="196" class="sans" font-size="150" font-weight="800" letter-spacing="-8" fill="#f3f6f7">ARTH</text>
  <rect x="58" y="214" width="96" height="3" fill="#22d3ee" class="scan"/>
</g>
<text x="62" y="248" class="mono" font-size="14" letter-spacing="3.2" fill="#9db2b7">FULL-STACK DEVELOPER  ·  AI  ·  SYSTEMS</text>
