  <animate attributeName="x" values="64;490;64" dur="3.8s" repeatCount="indefinite"/>
</rect>
<text x="64" y="310" class="m" font-size="12" letter-spacing="2" fill="#69838a">BUILDING PRODUCTS WITH SOFTWARE, AI &amp; AUTOMATION</text>
<line x1="770" y1="62" x2="770" y2="298" stroke="#1d383f" stroke-width="2"/>
<line x1="770" y1="92" x2="1338" y2="92" stroke="#143037"/>
<text x="820" y="86" class="m" font-size="13" letter-spacing="3" fill="#5e7b82">CURRENT FOCUS</text>
<text x="820" y="145" class="a" font-size="42" font-weight="750" fill="#f0f5f6">Kryin Office</text>
<text x="820" y="180" class="m" font-size="13" letter-spacing="1.5" fill="#8fa7ad">LANGGRAPH  ·  AI WORKFLOWS  ·  APIS</text>
<text x="820" y="230" class="m" font-size="13" letter-spacing="3" fill="#5e7b82">EDUCATION</text>
<text x="820" y="265" class="a" font-size="27" font-weight="650" fill="#dbe4e6">Engineering College Bikaner</text>
<text x="820" y="294" class="m" font-size="11" letter-spacing="2" fill="#6b858b">ECB  /  INDIA</text>
<circle cx="1290" cy="76" r="6" fill="#34d399" class="flicker"/>
<circle cx="1290" cy="76" r="6" fill="none" stroke="#34d399" opacity=".35"><animate attributeName="r" values="6;15;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;0;.45" dur="2s" repeatCount="indefinite"/></circle>
<text x="1308" y="81" class="m" font-size="12" letter-spacing="2.5" fill="#6ee7b7">ACTIVE</text>
<circle cx="780" cy="92" r="2.5" fill="#22d3ee"><animateMotion dur="4s" repeatCount="indefinite" path="M0 0 H550"/></circle>
<text x="1338" y="330" text-anchor="end" class="m" font-size="11" letter-spacing="2.5" fill="#536d74">BUILD / SHIP / LEARN</text>
</svg>