<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05090b"/><stop offset=".55" stop-color="#091417"/><stop offset="1" stop-color="#050b0d"/></linearGradient>
  <radialGradient id="glow" cx="70%" cy="35%" r="55%"><stop stop-color="#22d3ee" stop-opacity=".13"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8aa0a5" stroke-opacity=".06"/></pattern>
  <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="textGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .a{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,SFMono-Regular,monospace}
    .flicker{animation:flicker 4.8s steps(1,end) infinite}.glitch{animation:glitch 7s steps(1,end) infinite}
    @keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.42}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
    @keyframes glitch{0%,94%,100%{transform:translate(0)}95%{transform:translate(3px,-1px)}96%{transform:translate(-3px,1px)}}
  </style>
</defs>
<rect width="1400" height="360" rx="18" fill="url(#bg)"/>
<rect width="1400" height="360" rx="18" fill="url(#glow)"/>
<rect width="1400" height="360" rx="18" fill="url(#grid)">
  <animate attributeName="opacity" values=".72;.95;.72" dur="5s" repeatCount="indefinite"/>
</rect>
<g fill="none" stroke="#22d3ee" stroke-width="2">
  <path d="M30 62V30h32M1338 30h32v32M30 298v32h32M1338 330h32v-32"/>
  <path d="M30 76V30h46M1370 76V30h-46M30 284v46h46M1370 284v46h-46" opacity=".25"/>
</g>
<text x="58" y="54" class="m" font-size="14" letter-spacing="4" fill="#67e8f9">ARTH / GITHUB / 2026</text>
<g class="glitch">
  <text x="64" y="205" class="a" font-size="142" font-weight="850" letter-spacing="-7" fill="#22d3ee" opacity=".12" transform="translate(4 0)">ARTH.</text>
  <text x="64" y="205" class="a" font-size="142" font-weight="850" letter-spacing="-7" fill="#f4f7f8">ARTH<tspan fill="#22d3ee" filter="url(#textGlow)">.</tspan></text>
</g>
<text x="64" y="246" class="m" font-size="15" letter-spacing="3" fill="#a0b6bb">FULL-STACK DEVELOPER  ·  AI INTEGRATION  ·  SYSTEMS</text>
<line x1="64" y1="278" x2="650" y2="278" stroke="#18353b" stroke-width="2"/>
