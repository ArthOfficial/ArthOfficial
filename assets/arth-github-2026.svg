<text x="62" y="306" class="mono" font-size="11" letter-spacing="2" fill="#617b82">BUILDING PRODUCTS WITH SOFTWARE, AUTOMATION &amp; INTELLIGENT WORKFLOWS</text>

<line x1="748" y1="72" x2="748" y2="298" stroke="#20373d"/>
<text x="798" y="82" class="mono" font-size="11" letter-spacing="3" fill="#5f7b82">CURRENT WORK</text>
<text x="798" y="135" class="sans" font-size="39" font-weight="720" fill="#eef3f4">Kryin Office</text>
<rect x="798" y="153" width="420" height="1" fill="#203a40"/>
<text x="798" y="184" class="mono" font-size="12" letter-spacing="1.8" fill="#91a8ad">LANGGRAPH  ·  AI WORKFLOWS  ·  APIS</text>

<text x="798" y="231" class="mono" font-size="11" letter-spacing="3" fill="#5f7b82">EDUCATION</text>
