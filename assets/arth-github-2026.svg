  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#21c8d6"/><stop offset="1" stop-color="#21c8d6" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#c5d1d4" stroke-opacity=".028"/></pattern>
  <style>
    .s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .draw{animation:draw 8s ease-in-out infinite}.blink{animation:blink 4s ease-in-out infinite}.type{animation:type 12s steps(1,end) infinite}.cursor{animation:cursor 12s steps(1,end) infinite}
    @keyframes draw{0%,18%{opacity:0;transform:scaleX(.35);transform-origin:left}30%,78%{opacity:1;transform:scaleX(1)}90%,100%{opacity:0;transform:scaleX(.35);transform-origin:left}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes type{0%,8%{opacity:0;clip-path:inset(0 100% 0 0)}10%,18%{opacity:1;clip-path:inset(0 75% 0 0)}20%,28%{clip-path:inset(0 50% 0 0)}30%,38%{clip-path:inset(0 25% 0 0)}40%,65%{opacity:1;clip-path:inset(0 0 0 0)}72%,78%{opacity:.15;clip-path:inset(0 0 0 0)}82%,90%{opacity:1;clip-path:inset(0 0 0 0)}96%,100%{opacity:0;clip-path:inset(0 100% 0 0)}}
    @keyframes cursor{0%,8%{opacity:0}10%,18%{opacity:1}19%,20%{opacity:0}21%,28%{opacity:1}29%,30%{opacity:0}31%,38%{opacity:1}39%,40%{opacity:0}41%,65%{opacity:1}66%,70%{opacity:0}71%,75%{opacity:1}76%,80%{opacity:0}81%,90%{opacity:1}91%,100%{opacity:0}}
  </style>
</defs>
