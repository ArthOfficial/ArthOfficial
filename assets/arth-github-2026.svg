<text x="798" y="286" class="mono" font-size="10" letter-spacing="2.2" fill="#6a8389">ECB  /  INDIA</text>

<g class="quiet">
  <circle cx="1250" cy="82" r="5" fill="#34d399"/>
  <circle cx="1250" cy="82" r="12" fill="none" stroke="#34d399" stroke-opacity=".22">
    <animate attributeName="r" values="6;17;6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0;.45" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="1270" y="86" class="mono" font-size="10" letter-spacing="2.2" fill="#6ee7b7">ACTIVE</text>
</g>

<g class="signal" fill="#22d3ee"><circle cx="770" cy="72" r="2.5"/><circle cx="778" cy="72" r="1" opacity=".4"/></g>
<text x="1340" y="330" text-anchor="end" class="mono" font-size="10" letter-spacing="2.5" fill="#506a71">BUILD / SHIP / LEARN</text>
</svg>