<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b0d"/><stop offset="0.55" stop-color="#0b1215"/><stop offset="1" stop-color="#080d0f"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="1" stop-color="#34d399" stop-opacity="0.7"/></linearGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <radialGradient id="ambient" cx="82%" cy="28%" r="65%"><stop stop-color="#22d3ee" stop-opacity="0.09"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9fb0b5" stroke-opacity="0.045"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,SFMono-Regular,monospace}
    .quiet{animation:quiet 7s ease-in-out infinite}
    .scan{animation:scan 4.8s ease-in-out infinite}
    .signal{animation:signal 3.6s linear infinite}
    @keyframes quiet{0%,100%{opacity:.72}50%{opacity:1}}
    @keyframes scan{0%{transform:translateX(-520px);opacity:0}12%{opacity:.8}52%{opacity:.8}72%{opacity:0}100%{transform:translateX(920px);opacity:0}}
    @keyframes signal{0%{transform:translateX(0);opacity:0}10%{opacity:1}70%{opacity:1}100%{transform:translateX(500px);opacity:0}}
  </style>
</defs>

<rect width="1400" height="360" rx="18" fill="url(#bg)"/>
<rect width="1400" height="360" rx="18" fill="url(#ambient)"/>
<rect width="1400" height="360" rx="18" fill="url(#grid)" class="quiet"/>
<rect x="1" y="1" width="1398" height="358" rx="18" fill="none" stroke="#1b3035"/>
<path d="M28 74V28H74M1326 28h46v46M28 286v46h46M1326 332h46v-46" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".75"/>

<text x="58" y="54" class="mono" font-size="13" letter-spacing="4" fill="#67e8f9">ARTH / GITHUB / 2026</text>
